name: 热点自动抓取

# 触发方式：
#  1. 手动：打开仓库 → Actions → 左侧选「热点自动抓取」→ 右侧点「Run workflow」按钮
#  2. 定时：每天北京时间 08:30（UTC 00:30）自动执行
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: hotspot-fetch
  cancel-in-progress: false

jobs:
  fetch-hotspot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取国内平台热榜（微博/百度/B站 公开 API）
        run: node scripts/fetch_hotspot.js

      - name: 提交并推送 hotspot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotspot.json
          if git diff --cached --quiet; then
            echo "✅ 热点数据无变化，跳过提交"
          else
            git commit -m "hotspot: 自动更新热点数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 已推送最新热点数据"
          fi
